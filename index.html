const current=()=>{const m=location.hash.match(/^#\/(en|pt)\/([^/?]+)/);return {lang:m?.[1]||'en',page:m?.[2]||'home'};};
const url=(page,lang=current().lang)=>`#/${lang}/${page}`;
const logo=`<svg class="brand-symbol" viewBox="0 0 65 65" fill="none" aria-hidden="true"><path d="M9 48V18L36 7c10-4 15 0 18 7l2 8-18 8" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 48V28l24-8c8-2 14 2 16 8l3 11-27 10H16" stroke="currentColor" stroke-width="3.1" stroke-linejoin="round"/><path d="M30 42V33c0-7 11-7 11 0v9" stroke="currentColor" stroke-width="3.1" stroke-linecap="round"/></svg>`;
function brand(){return `<a href="${url('home')}" class="brand" aria-label="Bittencourt Realty home">${logo}<span class="brand-wordmark"><span>BITTENCOURT</span><span>R E A L T Y</span></span></a>`;}
function link(page,label,cls='btn'){return `<a class="${cls}" href="${url(page)}">${label} <span class="arrow" aria-hidden="true">↗</span></a>`;}
function frame(inner){const {lang,page}=current(),t=copy[lang];return `<div class="preview-banner">BITTENCOURT REALTY &nbsp; / &nbsp; DESIGN CONCEPT V1.0 &nbsp; / &nbsp; NOT A LIVE REAL ESTATE WEBSITE</div><header class="header"><div class="container header-inner">${brand()}<nav class="nav" id="nav" aria-label="Primary navigation">${paths.map((p,i)=>`<a href="${url(p)}" class="${page===p?'active':''}">${t.nav[i]}</a>`).join('')}</nav><div class="header-actions"><div class="locale" aria-label="${t.localeLabel}"><button data-lang="en" class="${lang==='en'?'current':''}" aria-label="English">EN</button><span>/</span><button data-lang="pt" class="${lang==='pt'?'current':''}" aria-label="Português">PT</button></div><a href="${url('contact')}" class="btn">${t.contact} <span class="arrow">↗</span></a><button class="menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-expanded="false">☰</button></div></div></header><main id="main">${inner}</main><footer class="footer"><div class="container"><div class="footer-top"><div>${brand()}<p>${t.footerText}</p></div><div><h4>${lang==='en'?'Explore':'Explore'}</h4>${paths.slice(1,4).map((p,i)=>`<a href="${url(p)}">${t.nav[i+1]}</a>`).join('')}</div><div><h4>${lang==='en'?'Company':'Empresa'}</h4>${paths.slice(4).map((p,i)=>`<a href="${url(p)}">${t.nav[i+4]}</a>`).join('')}</div><div><h4>${lang==='en'?'Location':'Localização'}</h4><p>Toronto, Ontario<br>Greater Toronto Area</p><p>Brokerage name: Bittencourt Realty<br>Legal identification pending verification.</p></div></div><div class="footer-bottom"><span>© 2026 Bittencourt Realty. ${t.all}</span><span>${t.disclaimer}</span></div></div></footer>`;}
function heading(kicker,title,description='',extra=''){return `<div class="section-heading"><div><div class="eyebrow">${kicker}</div><h2 class="h2">${title}</h2>${description?`<p class="copy">${description}</p>`:''}</div>${extra}</div>`;}
function founderIntro(t){return `<section class="section" id="story"><div class="container intro-grid"><div class="editorial-image"><img src="${asset.man}" alt="Bittencourt Realty professional working at a desk" loading="lazy"><img class="offset" src="${asset.woman}" alt="Bittencourt Realty professional seated in a portrait" loading="lazy"></div><div class="intro-copy"><div class="eyebrow">${t.introKicker}</div><h2 class="h2">${t.introTitle}</h2><p class="copy">${t.introText}</p><div style="margin-top:28px">${link('about',t.discover,'btn light')}</div></div></div></section>`;}
function services(t){return `<section class="section-tight" id="services"><div class="container">${heading(t.servicesKicker,t.servicesTitle)}<div class="service-grid"><a href="${url('buying')}" class="service-card"><span class="circle" aria-hidden="true">01</span><span class="service-arrow">↗</span><div class="text"><h3 class="h3">${t.buying}</h3><p>${t.buyingText}</p><span class="eyebrow">${t.learnBuying} ↗</span></div></a><a href="${url('selling')}" class="service-card dark"><span class="circle" aria-hidden="true">02</span><span class="service-arrow">↗</span><div class="text"><h3 class="h3">${t.selling}</h3><p>${t.sellingText}</p><span class="eyebrow" style="color:#ddcabc">${t.learnSelling} ↗</span></div></a></div></div></section>`;}
function search(t,full=false){return `<section class="search-section" id="property-search"><div class="container"><div class="eyebrow">${t.searchKicker}</div><h2 class="h2">${t.searchTitle}</h2><p class="copy">${t.searchText}</p><form id="search-form" class="search-form"><div class="search-field"><label for="area">${t.area}</label><select id="area"><option value="">${t.selectArea}</option>${['Toronto','Mississauga','Vaughan','Markham','Brampton','Richmond Hill','Oakville'].map(a=>`<option>${a}</option>`).join('')}</select></div><div class="search-field"><label for="type">${t.propType}</label><select id="type"><option value="">${t.anyType}</option><option>${t.typeHouse}</option><option>${t.typeCondo}</option><option>${t.typeTown}</option></select></div><div class="search-field"><label for="budget">${t.budget}</label><select id="budget"><option value="">${langBudget(t)}</option><option value="750000">CAD $750,000</option><option value="1000000">CAD $1,000,000</option><option value="1500000">CAD $1,500,000</option><option value="2000000">CAD $2,000,000+</option></select></div><button type="submit" class="btn">${t.searchBtn} <span class="arrow">↗</span></button></form><p class="search-hint">${t.searchHint}</p><div role="status" id="search-notice" class="search-notice hidden"></div>${full?`<div class="not-live" style="max-width:900px">${t.searchHint}</div>`:''}</div></section>`;}
function langBudget(t){return t===copy.pt?'Sem limite':'No maximum';}
function areas(t){return `<section class="section"><div class="container">${heading(t.areasKicker,t.areasTitle,t.areasText)}<div class="areas">${t.areas.map((a,i)=>`<div class="area"><div><h3>${a}</h3><span>GTA · ${String(i+1).padStart(2,'0')}</span></div></div>`).join('')}</div></div></section>`;}
function people(t){return `<section class="section team"><div class="container">${heading(t.teamKicker,t.teamTitle,t.teamText)}<div class="team-grid"><article class="person-card"><img src="${asset.man}" alt="Portrait of a Bittencourt Realty team member" loading="lazy"><div class="person-info"><div><h3>${t.teamNames[0]}</h3><p>${t.teamRole}</p></div><span class="arrow">↗</span></div></article><article class="person-card"><img src="${asset.woman}" alt="Portrait of a Bittencourt Realty team member" loading="lazy"><div class="person-info"><div><h3>${t.teamNames[1]}</h3><p>${t.teamRole}</p></div><span class="arrow">↗</span></div></article></div><p class="mock-label">${t.teamWarn}</p></div></section>`;}
const art=`<svg class="outline-house" viewBox="0 0 260 180" fill="none" aria-hidden="true"><path d="M18 140V81L128 16l114 67v57H18Z" stroke="#605a50" stroke-width="1.7"/><path d="M60 140V90h56v50m32 0V90h50v50M18 81l110-65 114 67" stroke="#605a50" stroke-width="1.7"/><path d="M67 98h42m-42 13h42m46-13h36m-36 13h36" stroke="#605a50" stroke-width="1"/></svg>`;
function articles(t,full=false){return `<section class="section" id="insights"><div class="container">${heading(t.insightsKicker,t.insightsTitle,t.insightsText,full?'':link('insights',t.viewArticles,'btn light'))}<div class="insights-grid">${t.articles.map((a,i)=>`<article class="article-card"><a href="${url('article-'+(i+1))}" aria-label="${a}"><div class="article-art">${art}</div></a><div class="article-info"><span class="tag">${i===0?'Buying':i===1?'Selling':'GTA living'}</span><h3>${a}</h3><a class="more" href="${url('article-'+(i+1))}">${t.read} ↗</a><div style="margin-top:16px" class="mock-label">${t.sample}</div></div></article>`).join('')}</div></div></section>`;}
function cta(t){return `<section class="cta-section"><div class="container cta-grid"><div><div class="eyebrow">${t.ctaKicker}</div><h2 class="h2">${t.ctaTitle}</h2></div><div><p class="copy">${t.ctaText}</p><div style="margin-top:24px">${link('contact',t.contact)}</div></div></div></section>`;}
function home(t){return `<section class="hero"><div class="container"><div class="hero-grid"><div class="hero-content"><div class="eyebrow">${t.eyebrow}</div><h1 class="display">${t.heroTitle}</h1><p class="copy">${t.heroText}</p><div class="hero-actions">${link('properties',t.explore)}${link('contact',t.start,'btn light')}</div></div><div class="hero-photo"><img src="${asset.founders}" alt="Two members of Bittencourt Realty photographed together in a warm interior" fetchpriority="high"><span class="hero-vertical">Toronto & Greater Toronto Area</span></div></div><div class="quick-links"><a href="${url('properties')}">${t.quick[0]}<span>↗</span></a><a href="${url('selling')}">${t.quick[1]}<span>↗</span></a><a href="${url('about')}">${t.quick[2]}<span>↗</span></a></div></div></section>${founderIntro(t)}${services(t)}${search(t)}${areas(t)}${people(t)}${articles(t)}${cta(t)}`;}
function interior(t,title,desc,body){return `<section class="interior-hero"><div class="container"><div class="eyebrow">${t.eyebrow}</div><h1 class="h2">${title}</h1><p class="copy">${desc}</p></div></section>${body}`;}
function steps(t,isBuy){const list=isBuy?t.buyingSteps:t.sellingSteps;return `<section class="content-section"><div class="container"><div class="eyebrow">${isBuy?t.buying:t.selling}</div><h2 class="h2">${t.servicesTitle}</h2><div class="journey-grid">${list.map((a,i)=>`<div class="step"><span class="num">0${i+1}</span><h3>${a}</h3><p>${isBuy?t.buyingText:t.sellingText}</p></div>`).join('')}</div></div></section>`;}
function contact(t){return interior(t,t.contactHero,t.contactDesc,`<section class="content-section"><div class="container contact-grid"><div><div class="eyebrow">BITTENCOURT REALTY</div><h2 class="h2">${t.contact}</h2><p class="copy">${t.ctaText}</p><div class="contact-method"><h3>${t.schedule}</h3><p>${t.scheduleDesc}</p><button class="btn light" data-schedule="1">${t.schedule} ↗</button></div><div class="contact-method"><h3>${t.whatsapp}</h3><p>${t.whatsappDesc}</p><button class="btn light" disabled>${t.whatsapp}</button></div></div><div class="form-card"><div class="eyebrow">${t.contactForm}</div><h2 class="h3">${t.contactForm}</h2><form id="contact-form"><label for="name">${t.name}</label><input id="name" name="name" required autocomplete="name"><label for="email">${t.email}</label><input id="email" name="email" type="email" required autocomplete="email"><label for="phone">${t.phone}</label><input id="phone" name="phone" type="tel" autocomplete="tel"><label for="topic">${t.topic}</label><select id="topic" name="topic">${t.topicOpt.map(x=>`<option>${x}</option>`).join('')}</select><label for="message">${t.message}</label><textarea id="message" name="message" required></textarea><p class="consent">${t.consent}</p><button type="submit" class="btn">${t.send} ↗</button><div id="form-feedback" class="feedback" role="status"></div></form></div></div></section>`);}
function articlePage(t,n){const i=Math.max(0,Math.min(2,Number(n)-1));return interior(t,t.articles[i],t.sample,`<section class="content-section"><div class="container"><div class="prose"><a class="back-link" href="${url('insights')}">← ${t.back}</a><div class="article-art" style="margin-top:35px">${art}</div><p>${t.articleSampleText}</p><h2>${t.articles[i]}</h2><p>${t.articleSampleText}</p><p class="not-live">${t.sample} · Sanity CMS integration pending. No market facts or sourced data have been published in this prototype.</p></div></div></section>${cta(t)}`);}
function render(){const {lang,page}=current(),t=copy[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'en';const p=page.startsWith('article-')?articlePage(t,page.split('-')[1]):page==='home'?home(t):page==='buying'?interior(t,t.buyingHero,t.buyingDesc,steps(t,true)+cta(t)):page==='selling'?interior(t,t.sellingHero,t.sellingDesc,steps(t,false)+cta(t)):page==='properties'?interior(t,t.propertiesHero,t.propertiesDesc,search(t,true)+cta(t)):page==='about'?interior(t,t.aboutHero,t.aboutDesc,founderIntro(t)+people(t)+cta(t)):page==='insights'?interior(t,t.insightsHero,t.insightsDesc,articles(t,true)+cta(t)):page==='contact'?contact(t):home(t);document.getElementById('app').innerHTML=frame(p);document.title=`Bittencourt Realty · ${paths.includes(page)?t.nav[paths.indexOf(page)]:t.nav[5]}`;attach(t);window.scrollTo(0,0)}
function attach(t){document.querySelector('#menu-btn')?.addEventListener('click',e=>{const nav=document.getElementById('nav');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(nav.classList.contains('open')))});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{const page=current().page;location.hash=`#/${b.dataset.lang}/${page}`;}));document.getElementById('search-form')?.addEventListener('submit',e=>{e.preventDefault();const z=document.getElementById('search-notice');z.textContent=t.searchNotice;z.classList.remove('hidden')});document.getElementById('contact-form')?.addEventListener('submit',e=>{e.preventDefault();document.getElementById('form-feedback').textContent=t.formFeedback;e.target.reset()});document.querySelector('[data-schedule]')?.addEventListener('click',()=>{const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close-modal" aria-label="${t.close}">×</button><div class="eyebrow">BITTENCOURT REALTY</div><h2 id="modal-title">${t.appointment}</h2><p>${t.appointmentBody}</p><button class="btn" id="modal-ok">${t.close}</button></div>`;document.body.appendChild(m);m.querySelector('.close-modal').focus();const close=()=>m.remove();m.querySelector('.close-modal').onclick=close;m.querySelector('#modal-ok').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});m.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})}
render();window.addEventListener('hashchange',render);
</script>
</body>
</html>
