/* Home hero button: high contrast on photography */
.hero-panel .hero-actions .btn.light{background:#fdfbf8;border-color:#fdfbf8;color:#292822;box-shadow:0 4px 16px rgba(17,16,13,.12)}
.hero-panel .hero-actions .btn.light:hover{background:#e6d8c8;border-color:#e6d8c8;color:#292822}
.hero-panel .hero-actions .btn.light:focus-visible{outline:3px solid #fdfbf8;outline-offset:4px}
/* Social links: icon only, visible hover and keyboard focus */
.footer a.social-icon{display:inline-flex;align-items:center;justify-content:center;width:43px;height:43px;border:1px solid #a4aaa0;border-radius:50%;margin:15px 0 0;color:#f5f1ec;transition:background .2s,color .2s,border-color .2s}
.footer a.social-icon:hover{background:#f5f1ec;border-color:#f5f1ec;color:#252923}
.footer a.social-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none}
/* Testimonials: editorial, accessible controlled carousel */
.testimonials-section{padding:100px 0;background:#ebe4dc}
.testimonial-layout{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(0,1.15fr);gap:clamp(30px,6vw,100px);align-items:center}
.testimonials-intro .h2{max-width:440px}
.testimonials-intro .copy{max-width:410px}
.testimonial-card{background:#fdfbf8;border:1px solid #d8d0c7;padding:clamp(30px,4vw,56px);min-height:345px;display:flex;flex-direction:column;justify-content:space-between}
.testimonial-slide[hidden]{display:none}
.testimonial-kind{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#92715e;font-weight:700}
.testimonial-slide h3{font:400 clamp(31px,3vw,43px)/1.18 var(--serif);letter-spacing:-.03em;margin:21px 0}
.testimonial-slide p{font-size:15px;line-height:1.8;color:#66645d;max-width:540px;margin:0 0 12px}
.testimonial-note{font-size:11px;line-height:1.65;color:#70665b;margin:18px 0 0}
.testimonial-controls{border-top:1px solid #d8d0c7;padding-top:19px;margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.testimonial-dots{display:flex;align-items:center;gap:10px}
.testimonial-dot{height:10px;width:10px;border-radius:50%;border:1px solid #9c755f;background:transparent;padding:0}
.testimonial-dot[aria-pressed="true"]{background:#9c755f}
.testimonial-arrows{display:flex;gap:10px;align-items:center}
.testimonial-arrow{display:inline-grid;place-items:center;width:43px;height:43px;border:1px solid #9c958d;background:transparent;color:#292822;border-radius:50%;font-size:18px;transition:background .2s}
.testimonial-arrow:hover{background:#ebe4dc}
.testimonial-count{font:600 11px var(--sans);color:#6d6c63;letter-spacing:.1em;margin-right:8px}
@media(max-width:860px){.testimonial-layout{grid-template-columns:1fr;gap:30px}.testimonials-section{padding:75px 0}.testimonial-card{min-height:320px}}
@media(max-width:600px){.testimonials-section{padding:65px 0}.testimonial-card{padding:26px;min-height:340px}.testimonial-slide h3{font-size:33px}.testimonial-controls{margin-top:22px}}

/* Bittencourt Realty | equal-sized founder portraits */
.editorial-image.equal-portraits{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:18px;position:relative}
.editorial-image.equal-portraits .portrait-card{position:relative;aspect-ratio:3 / 4;overflow:hidden;margin:0;background:#d9cfc5;min-width:0}
.editorial-image.equal-portraits .portrait-card img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center 32%;border:0}
.editorial-image.equal-portraits .portrait-card:first-child img{object-position:center 38%}
@media(max-width:600px){.editorial-image.equal-portraits{gap:12px}.editorial-image.equal-portraits .portrait-card{aspect-ratio:3 / 4}}

/* Hero layout: flush to navigation; use the original portrait on smaller screens */
.hero{padding-top:0}
.hero-picture{display:block}
@media (min-width:601px) and (max-width:860px){
.hero-full{display:grid;grid-template-columns:48% 52%;min-height:0;overflow:hidden}
.hero-full::before{display:none}
.hero-picture{grid-row:1;grid-column:2;height:100%;width:100%;overflow:hidden}
.hero-full-media{position:relative;inset:auto;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.hero-home-overlay{grid-row:1;grid-column:1;background:var(--pine);min-height:550px;display:flex;align-items:center}
.hero-home-inner{min-height:0}
.hero-panel{padding:48px 0;max-width:100%}
.hero-panel .display{font-size:clamp(35px,4.9vw,50px)}
.hero-panel .copy{font-size:13px;line-height:1.65}
.hero-panel .hero-actions{gap:10px}
.hero-panel .hero-actions .btn{font-size:10px;padding:0 14px}
}
@media (max-width:600px){
.hero-full{display:flex;flex-direction:column;min-height:0;overflow:visible}
.hero-full::before{display:none}
.hero-picture{display:block;width:100%;height:auto;background:#e6ded5}
.hero-full-media{display:block;position:relative;inset:auto;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center center}
.hero-home-overlay{min-height:0;background:var(--pine);display:block}
.hero-home-inner{display:block;min-height:0}
.hero-panel{max-width:100%;padding:30px 0 45px}
.hero-panel .display{font-size:clamp(37px,9.5vw,51px);margin:12px 0 16px;line-height:1.1}
.hero-panel .eyebrow{letter-spacing:.19em}
.hero-panel .copy{font-size:14px;line-height:1.7}
.hero-panel .hero-actions{margin-top:25px;gap:10px}
.hero-panel .hero-actions .btn{min-height:48px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}

const url=(page,lang=current().lang)=>`#/${lang}/${page}`;

v></div></footer>`;}
function heading(kicker,title,description='',extra=''){return `<div class="section-heading"><div><div class="eyebrow">${kicker}</div><h2 class="h2">${title}</h2>${description?`<p class="copy">${description}</p>`:''}</div>${extra}</div>`;}

    <div class="testimonial-card" id="testimonial-carousel" role="region" aria-roledescription="carousel" aria-label="${controls}" tabindex="0">
      <div class="testimonial-track" aria-live="polite">
        ${testimonialPreviewItems.map((item,i)=>`<article class="testimonial-slide" role="group" aria-roledescription="slide" aria-label="${i+1} / ${testimonialPreviewItems.length}" ${i!==0?'hidden':''}><span class="testimonial-kind">${item[lang].kind}</span><h3>${item[lang].title}</h3><p>${item[lang].body}</p></article>`).join('')}
      </div>
      <div class="testimonial-controls"><div class="testimonial-dots" aria-label="${controls}">${testimonialPreviewItems.map((_,i)=>`<button class="testimonial-dot" type="button" data-testimonial-index="${i}" aria-label="${pt?'Ver depoimento':'View testimonial'} ${i+1}" aria-pressed="${i===0?'true':'false'}"></button>`).join('')}</div><div class="testimonial-arrows"><span class="testimonial-count" aria-live="off">01 / 0${testimonialPreviewItems.length}</span><button class="testimonial-arrow" type="button" data-testimonial-nav="-1" aria-label="${pt?'Anterior':'Previous'}">←</button><button class="testimonial-arrow" type="button" data-testimonial-nav="1" aria-label="${pt?'Próximo':'Next'}">→</button></div></div>
    </div></div></section>`;
}
function cta(t){return `<section class="cta-section"><div class="container cta-grid"><div><div class="eyebrow">${t.ctaKicker}</div><h2 class="h2">${t.ctaTitle}</h2></div><div><p class="copy">${t.ctaText}</p><div style="margin-top:24px">${link('contact',t.contact)}</div></div></div></section>`;}
function home(t){return `<section class="hero"><div class="hero-full"><picture class="hero-picture"><source media="(max-width: 860px)" srcset="${asset.founders}"><img class="hero-full-media" src="${asset.homeHero}" alt="Rodrigo Cid and Juliana Bittencourt of Bittencourt Realty in an elegant interior" fetchpriority="high"></picture><div class="hero-home-overlay"><div class="container hero-home-inner"><div class="hero-panel"><div class="eyebrow">${t.eyebrow}</div><h1 class="display">${t.heroTitle}</h1><p class="copy">${t.heroText}</p><div class="hero-actions">${link('properties',t.explore)}${link('contact',t.start,'btn light')}</div></div></div></div></div><div class="hero-links"><div class="container"><div class="quick-links"><a href="${url('properties')}">${t.quick[0]}<span>↗</span></a><a href="${url('selling')}">${t.quick[1]}<span>↗</span></a><a href="${url('about')}">${t.quick[2]}<span>↗</span></a></div></div></div></section>${founderIntro(t)}${services(t)}${search(t)}${areas(t)}${people(t)}${testimonials(t)}${articles(t)}${cta(t)}`;}function interior(pageKey,t,title,desc,body){return `<section class="interior-hero has-image"><img class="interior-hero-media" src="${heroFor(pageKey)}" alt="${heroAlt(pageKey)}" loading="eager"><div class="interior-hero-overlay"><div class="container"><div class="interior-copy"><div class="eyebrow">${t.eyebrow}</div><h1 class="h2">${title}</h1><p class="copy">${desc}</p></div></div></div></section>${body}`;}function steps(t,isBuy){const list=isBuy?t.buyingSteps:t.sellingSteps;return `<section class="content-section"><div class="container"><div class="eyebrow">${isBuy?t.buying:t.selling}</div><h2 class="h2">${t.servicesTitle}</h2><div class="journey-grid">${list.map((a,i)=>`<div class="step"><span class="num">0${i+1}</span><h3>${a}</h3><p>${isBuy?t.buyingText:t.sellingText}</p></div>`).join('')}</div></div></section>`;}
function contact(t){return interior('contact',t,t.contactHero,t.contactDesc,`<section class="content-section"><div class="container contact-grid"><div><div class="eyebrow">BITTENCOURT REALTY</div><h2 class="h2">${t.contact}</h2><p class="copy">${t.ctaText}</p><div class="contact-method"><h3>${t.schedule}</h3><p>${t.scheduleDesc}</p><button class="btn light" data-schedule="1">${t.schedule} ↗</button></div><div class="contact-method"><h3>${t.whatsapp}</h3><p>${t.whatsappDesc}</p><button class="btn light" disabled>${t.whatsapp}</button></div></div><div class="form-card"><div class="eyebrow">${t.contactForm}</div><h2 class="h3">${t.contactForm}</h2><form id="contact-form"><label for="name">${t.name}</label><input id="name" name="name" required autocomplete="name"><label for="email">${t.email}</label><input id="email" name="email" type="email" required autocomplete="email"><label for="phone">${t.phone}</label><input id="phone" name="phone" type="tel" autocomplete="tel"><label for="topic">${t.topic}</label><select id="topic" name="topic">${t.topicOpt.map(x=>`<option>${x}</option>`).join('')}</select><label for="message">${t.message}</label><textarea id="message" name="message" required></textarea><p class="consent">${t.consent}</p><button type="submit" class="btn">${t.send} ↗</button><div id="form-feedback" class="feedback" role="status"></div></form></div></div></section>`);}
function articlePage(t,n){const i=Math.max(0,Math.min(2,Number(n)-1));return interior('insights',t,t.articles[i],t.sample,`<section class="content-section"><div class="container"><div class="prose"><a class="back-link" href="${url('insights')}">← ${t.back}</a><div class="article-art" style="margin-top:35px">${art}</div><p>${t.articleSampleText}</p><h2>${t.articles[i]}</h2><p>${t.articleSampleText}</p><p class="not-live">${t.sample} · Sanity CMS integration pending. No market facts or sourced data have been published in this prototype.</p></div></div></section>${cta(t)}`);}function render(){const {lang,page}=current(),t=copy[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'en';const p=page.startsWith('article-')?articlePage(t,page.split('-')[1]):page==='home'?home(t):page==='buying'?interior('buying',t,t.buyingHero,t.buyingDesc,steps(t,true)+cta(t)):page==='selling'?interior('selling',t,t.sellingHero,t.sellingDesc,steps(t,false)+cta(t)):page==='properties'?interior('properties',t,t.propertiesHero,t.propertiesDesc,search(t,true)+cta(t)):page==='about'?interior('about',t,t.aboutHero,t.aboutDesc,founderIntro(t)+people(t)+cta(t)):page==='insights'?interior('insights',t,t.insightsHero,t.insightsDesc,articles(t,true)+cta(t)):page==='contact'?contact(t):home(t);document.getElementById('app').innerHTML=frame(p);document.title=`Bittencourt Realty · ${paths.includes(page)?t.nav[paths.indexOf(page)]:t.nav[5]}`;attach(t);window.scrollTo(0,0)}function attach(t){
const testimonialRoot=document.getElementById('testimonial-carousel');
if(testimonialRoot){
  const slides=Array.from(testimonialRoot.querySelectorAll('.testimonial-slide'));
  const dots=Array.from(testimonialRoot.querySelectorAll('.testimonial-dot'));
  const count=testimonialRoot.querySelector('.testimonial-count');
  let active=0;
  const show=(next)=>{
    active=(next+slides.length)%slides.length;
    slides.forEach((slide,i)=>{slide.hidden=i!==active});
    dots.forEach((dot,i)=>dot.setAttribute('aria-pressed',i===active?'true':'false'));
    if(count)count.textContent=String(active+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  };
  testimonialRoot.querySelectorAll('[data-testimonial-nav]').forEach(button=>button.addEventListener('click',()=>show(active+Number(button.dataset.testimonialNav))));
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>show(i)));
  testimonialRoot.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();show(active+(event.key==='ArrowRight'?1:-1));}});
}
document.querySelector('#menu-btn')?.addEventListener('click',e=>{const nav=document.getElementById('nav');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(nav.classList.contains('open')))});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{const page=current().page;location.hash=`#/${b.dataset.lang}/${page}`;}));document.getElementById('search-form')?.addEventListener('submit',e=>{e.preventDefault();const z=document.getElementById('search-notice');z.textContent=t.searchNotice;z.classList.remove('hidden')});document.getElementById('contact-form')?.addEventListener('submit',e=>{e.preventDefault();document.getElementById('form-feedback').textContent=t.formFeedback;e.target.reset()});document.querySelector('[data-schedule]')?.addEventListener('click',()=>{const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="close-modal" aria-label="${t.close}">×</button><div class="eyebrow">BITTENCOURT REALTY</div><h2 id="modal-title">${t.appointment}</h2><p>${t.appointmentBody}</p><button class="btn" id="modal-ok">${t.close}</button></div>`;document.body.appendChild(m);m.querySelector('.close-modal').focus();const close=()=>m.remove();m.querySelector('.close-modal').onclick=close;m.querySelector('#modal-ok').onclick=close;m.addEventListener('click',e=>{if(e.target===m)close()});m.addEventListener('keydown',e=>{if(e.key==='Escape')close()})})}
render();window.addEventListener('hashchange',render);
</script>
</body>
</html>
